<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111319">
  <title>MB Partners</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { background: #111319 url('/static/assets/partners-sport-bg.png') center top / cover fixed no-repeat; }
    body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(10,12,16,.32), rgba(10,12,16,.78)); pointer-events: none; }
    #app { min-height: 100vh; background: linear-gradient(180deg, rgba(17,19,25,.46), rgba(17,19,25,.8)); }
  </style>
</head>
<body>
  <main id="app">
    <header class="header">
      <button class="brand" type="button" onclick="showHome()" aria-label="Home"><span class="brand-mark">MB</span><span>MB<br><small>PARTNERS</small></span></button>
      <span id="profileBadge" class="profile-badge">Guest</span>
    </header>
    <section id="home" class="content" aria-live="polite"></section>
    <section id="screen" class="content" hidden aria-live="polite"></section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
